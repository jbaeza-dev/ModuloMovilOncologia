# Configuración PostgreSQL 17 optimizada para VM Universitaria (4 GB RAM total, 20 GB disco)
# Presupuesto asignado al contenedor PostgreSQL: 768 MiB RAM

# Conectividad y Red
listen_addresses = '*'
max_connections = 50

# Memoria (Presupuesto total estimado: ~500 MiB en buffers y procesos)
shared_buffers = 128MB
temp_buffers = 8MB
work_mem = 2MB
maintenance_work_mem = 32MB
effective_cache_size = 256MB

# Replicación Lógica (PowerSync CDC)
wal_level = logical
max_wal_senders = 5
max_replication_slots = 5

# Control de WAL y Protección del Disco (Total 20 GB)
# IMPORTANTE: max_slot_wal_keep_size previene que una desconexión de PowerSync sature el disco.
wal_keep_size = 512MB
max_slot_wal_keep_size = 1024MB
max_wal_size = 512MB
min_wal_size = 64MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 5min

# Planificador y Costes
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging y Diagnóstico (Rootless / Systemd)
logging_collector = off
log_destination = 'stderr'
log_min_messages = warning
log_min_error_statement = error
log_line_prefix = '%m [%p] %u@%d: '
log_timezone = 'UTC'

# Configuración Regional
datestyle = 'iso, ymd'
timezone = 'UTC'
client_encoding = 'UTF8'
default_text_search_config = 'pg_catalog.spanish'
