# PowerSync Service 1.27.1 - Configuración Despliegue Universitario
# Variables inyectadas por entorno Podman / Systemd Quadlet

replication:
  connections:
    - type: postgresql
      uri: !env PS_SOURCE_URI
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_STORAGE_URI
  sslmode: disable

port: 8080
sync_config:
  path: /config/sync-config.yaml

client_auth:
  # Supabase Auth JWKS dinámico verificado por asimetría (RS256 / ES256)
  jwks_uri: !env PS_JWKS_URI
  audience:
    - authenticated

api:
  tokens:
    - !env PS_ADMIN_TOKEN

telemetry:
  disable_telemetry_sharing: true

healthcheck:
  probes:
    use_http: true
    use_filesystem: true

system:
  logging:
    level: warn
    format: json
