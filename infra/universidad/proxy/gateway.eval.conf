# Nginx Proxy Reverso de Evaluación - Gateway Móvil y PowerSync (Puerto 18019)
# QuimioCare - Entorno Local de Evaluación

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 18019;
    server_name _;

    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # PowerSync: remove the institutional prefix exactly once, preserve /sync/stream.
    location = /quimiocare-backend/sync/stream {
        proxy_pass http://host.docker.internal:31080/sync/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }
    location /quimiocare-backend/sync/ { return 404; }
    location = /sync/stream {
        proxy_pass http://host.docker.internal:31080/sync/stream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location /sync/ { return 404; }

    # 2. Documentación Swagger UI del Gateway
    location /quimiocare-backend/docs/ {
        proxy_pass http://host.docker.internal:3101/quimiocare-backend/docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs/ {
        proxy_pass http://host.docker.internal:3101/docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Gateway Móvil API - Reescritura explícita de prefijo (/quimiocare-backend/api/gateway/ -> /api/gateway/)
    location /quimiocare-backend/api/gateway/ {
        rewrite ^/quimiocare-backend/api/gateway/(.*)$ /api/gateway/$1 break;
        proxy_pass http://host.docker.internal:3101;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /api/gateway/ {
        proxy_pass http://host.docker.internal:3101/api/gateway/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location = /quimiocare-backend/health {
        proxy_pass http://host.docker.internal:3101/health;
    }

    # 4. Salud de Gateway
    location = /health {
        proxy_pass http://host.docker.internal:3101/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 5. Health check del proxy backend
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Bloqueo predeterminado de cualquier otra ruta
    location / {
        return 404 "{\"error\":\"Ruta no autorizada en Gateway\"}\n";
    }
}
