# Nginx Proxy Reverso de Evaluación - Simulador Clínico, IA, Swagger y Panel (Puerto 8018)
# QuimioCare - Entorno Local de Evaluación

server {
    listen 8018;
    server_name _;

    # OAuth codes must not appear in access logs.
    location = /quimiocare/docs/preparacion/oauth/callback {
        access_log off;
        proxy_pass http://qc-clinical:3002;
        proxy_set_header Host $host;
    }
    location = /docs/preparacion/oauth/callback {
        access_log off;
        proxy_pass http://qc-clinical:3002/quimiocare/docs/preparacion/oauth/callback;
        proxy_set_header Host $host;
    }


    client_max_body_size 6m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Bloqueo estricto de rutas sintéticas/demo peligrosas (reset, generación de escenarios)
    location ~* (/__demo/|/quimiocare/__demo/) {
        return 404 "{\"error\":\"Not Found\"}\n";
    }

    # 2. Documentación Interactiva Swagger UI Offline
    location /quimiocare/docs/ {
        proxy_pass http://qc-clinical:3002/quimiocare/docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs/ {
        # Restore the public prefix so login, assets and redirects use public URLs.
        proxy_pass http://qc-clinical:3002/quimiocare/docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Descarga Binaria Segura de Infografías Educativas (Acceso mediante enlace)
    location /archivos/educacion/ {
        proxy_pass http://qc-clinical:3002/archivos/educacion/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /quimiocare/archivos/educacion/ {
        proxy_pass http://qc-clinical:3002/quimiocare/archivos/educacion/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Panel Administrativo Web de Operador Clínico
    location /quimiocare/admin {
        proxy_pass http://qc-clinical:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        proxy_pass http://qc-clinical:3002/quimiocare/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin/ {
        proxy_pass http://qc-clinical:3002/quimiocare/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. APIs Administrativas (Vinculación y Publicación Multipart hasta 6 MiB)
    location /quimiocare/admin/api/ {
        rewrite ^/quimiocare/admin/api/(.*)$ /admin/api/$1 break;
        proxy_pass http://qc-clinical:3002;
        proxy_http_version 1.1;
        client_max_body_size 6m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/api/ {
        proxy_pass http://qc-clinical:3002/admin/api/;
        proxy_http_version 1.1;
        client_max_body_size 6m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6. Servicio de IA Sintética Contractual (IA-01 Chat)
    location = /quimiocare/api/v1/chat {
        rewrite ^/quimiocare/api/v1/chat$ /api/v1/chat break;
        proxy_pass http://qc-ai:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/chat {
        proxy_pass http://qc-ai:3003/api/v1/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 7. API Clínica para Aplicación Móvil (Operaciones C-01 a C-16)
    location /quimiocare/api/v1/ {
        rewrite ^/quimiocare/api/v1/(.*)$ /api/v1/$1 break;
        proxy_pass http://qc-clinical:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        proxy_pass http://qc-clinical:3002/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 8. Health check del proxy del simulador
    location = /quimiocare/educacion/api/v1/podcasts {
        proxy_pass http://qc-clinical:3002/educacion/api/v1/podcasts;
        proxy_set_header Host $host;
    }
    location = /educacion/api/v1/podcasts {
        proxy_pass http://qc-clinical:3002/educacion/api/v1/podcasts;
        proxy_set_header Host $host;
    }

    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Bloqueo predeterminado
    location / {
        return 404 "{\"error\":\"Ruta no autorizada en Simulador\"}\n";
    }
}
