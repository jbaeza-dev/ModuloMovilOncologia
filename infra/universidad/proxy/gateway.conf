# Nginx Proxy Reverso de Evaluación - Gateway Móvil y PowerSync (Puerto 8019)
# QuimioCare - Entorno Local de Evaluación

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_authorization $qc_sync_auth_header {
    "~*^Token\s+(.+)$" "Bearer $1";
    default            $http_authorization;
}

server {
    listen 8019;
    server_name _;

    client_max_body_size 64k;
    location @qc_auth_unavailable { return 503; }
    location = /_qc_sync_auth {
        internal;
        proxy_pass http://qc-gateway:3001/internal/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $qc_sync_auth_header;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Parra strips /quimiocare-backend. Keep the prefixed route for direct diagnostics.
    location = /quimiocare-backend/sync/stream {
        auth_request /_qc_sync_auth;
        error_page 500 = @qc_auth_unavailable;
        proxy_pass http://qc-powersync:8080/sync/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }
    location /quimiocare-backend/sync/ { return 404; }
    location = /sync/stream {
        auth_request /_qc_sync_auth;
        error_page 500 = @qc_auth_unavailable;
        proxy_pass http://qc-powersync:8080/sync/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }
    location /sync/ { return 404; }

    # The pinned client requests this checkpoint after uploads before applying downloads.
    location = /quimiocare-backend/write-checkpoint2.json {
        auth_request /_qc_sync_auth;
        error_page 500 = @qc_auth_unavailable;
        proxy_pass http://qc-powersync:8080/write-checkpoint2.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $qc_sync_auth_header;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_cache off;
        expires -1;
    }
    location = /write-checkpoint2.json {
        auth_request /_qc_sync_auth;
        error_page 500 = @qc_auth_unavailable;
        proxy_pass http://qc-powersync:8080/write-checkpoint2.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $qc_sync_auth_header;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_cache off;
        expires -1;
    }

    # 2. Documentación Swagger UI del Gateway
    location /quimiocare-backend/docs/ {
        proxy_pass http://qc-gateway:3001/quimiocare-backend/docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs/ {
        proxy_pass http://qc-gateway:3001/docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Gateway Móvil API - Reescritura explícita de prefijo (/quimiocare-backend/api/gateway/ -> /api/gateway/)
    location /quimiocare-backend/api/gateway/ {
        rewrite ^/quimiocare-backend/api/gateway/(.*)$ /api/gateway/$1 break;
        proxy_pass http://qc-gateway:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Mayor que el límite del gateway (65 s) y menor que la espera de la app (75 s).
        proxy_read_timeout 70s;
        proxy_connect_timeout 5s;
    }

    location /api/gateway/ {
        proxy_pass http://qc-gateway:3001/api/gateway/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Mayor que el límite del gateway (65 s) y menor que la espera de la app (75 s).
        proxy_read_timeout 70s;
        proxy_connect_timeout 5s;
    }

    location = /quimiocare-backend/health {
        proxy_pass http://qc-gateway:3001/health;
    }

    # 4. Salud de Gateway
    location = /health {
        proxy_pass http://qc-gateway:3001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 5. Health check del proxy backend
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Bloqueo predeterminado de cualquier otra ruta
    location / {
        return 404 "{\"error\":\"Ruta no autorizada en Gateway\"}\n";
    }
}
