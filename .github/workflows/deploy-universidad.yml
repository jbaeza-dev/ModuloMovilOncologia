name: CD Universidad

# Called only after the CI gate on main. No dispatch/tag workflow can bypass CI.
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: universidad-deploy
  cancel-in-progress: false

jobs:
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        service: [simulator, gateway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set immutable source tag
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
        run: echo "tag=ghcr.io/${OWNER,,}/quimiocare-$SERVICE:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Build once on GitHub, never on the 4 GB server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/demo/Containerfile.${{ matrix.service }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.quimiocare.managed=true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Block fixable high/critical vulnerabilities in the exact image to publish
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ steps.image.outputs.tag }}
          format: json
          output: trivy-${{ matrix.service }}.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Produce SBOM for the same image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ steps.image.outputs.tag }}
          format: cyclonedx
          output: sbom-${{ matrix.service }}.json
          exit-code: '0'
      - name: Push the scanned image and record its registry digest
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
          SERVICE: ${{ matrix.service }}
        run: |
          docker push "$IMAGE"
          mkdir -p build/digests
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' > build/repository-digests.json
          node --input-type=module -e 'import fs from "node:fs"; const prefix=process.env.IMAGE.split(":")[0]+"@";const ref=JSON.parse(fs.readFileSync("build/repository-digests.json")).find(x=>x.startsWith(prefix)); if(!ref || !/@sha256:[a-f0-9]{64}$/.test(ref))throw Error("Registry digest missing"); fs.writeFileSync("build/digests/"+process.env.SERVICE+".json",JSON.stringify({digest:ref.split("@")[1],revision:process.env.GITHUB_SHA})+"\n")'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.service }}
          path: build/digests/*.json
          retention-days: 14
          if-no-files-found: error
      - name: Retain security evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-${{ matrix.service }}-${{ github.sha }}
          path: |
            trivy-*.json
            sbom-*.json
          retention-days: 14
          if-no-files-found: warn

  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: universidad
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: build/digests
          merge-multiple: true
      - name: Package configuration, scripts and digest manifest without dotenv
        env:
          OWNER: ${{ github.repository_owner }}
          RELEASE_OUTPUT: build/universidad-release
        run: |
          export IMAGE_NAMESPACE="ghcr.io/${OWNER,,}"
          node scripts/package-university-release.mjs
          python3 infra/universidad/scripts/release.py build/universidad-release --namespace "$IMAGE_NAMESPACE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: universidad-release-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/universidad-release.tar.gz
            build/universidad-release/manifest.json
          retention-days: 14
      - name: Skip obsolete commits before opening an SSH connection
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$latest" == "$GITHUB_SHA" ]]; then echo 'deploy=true' >> "$GITHUB_OUTPUT"; else echo 'deploy=false' >> "$GITHUB_OUTPUT"; fi
      - name: Diagnose SSH network without authentication
        if: steps.latest.outputs.deploy == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          SSH_HOST: ${{ secrets.QC_SSH_HOST }}
          SSH_PORT: ${{ secrets.QC_SSH_PORT }}
          QC_PUBLIC_ORIGIN: ${{ vars.QC_PUBLIC_ORIGIN }}
        run: python3 infra/universidad/scripts/diagnose-ssh.py
      - name: Transfer and deploy over pinned SSH
        if: steps.latest.outputs.deploy == 'true'
        env:
          SSH_HOST: ${{ secrets.QC_SSH_HOST }}
          SSH_USER: ${{ secrets.QC_SSH_USER }}
          SSH_PORT: ${{ secrets.QC_SSH_PORT }}
          SSH_KEY: ${{ secrets.QC_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.QC_SSH_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: bash scripts/ci-deploy-university.sh
      - name: Verify public TLS and PowerSync prefix from outside the host
        if: steps.latest.outputs.deploy == 'true'
        env:
          QC_PUBLIC_ORIGIN: ${{ vars.QC_PUBLIC_ORIGIN }}
        run: |
          node --input-type=module -e 'const raw=process.env.QC_PUBLIC_ORIGIN;const u=new URL(raw);if(u.protocol!=="https:"||u.origin!==raw)throw Error("Configure QC_PUBLIC_ORIGIN as the exact HTTPS origin")'
          curl --fail --silent --show-error --max-time 20 "$QC_PUBLIC_ORIGIN/quimiocare-backend/health" > /dev/null
          code=$(curl --silent --show-error --max-time 20 -X POST -H 'Content-Type: application/json' -d '{}' -o /dev/null -w '%{http_code}' "$QC_PUBLIC_ORIGIN/quimiocare-backend/sync/stream")
          test "$code" = 401
      - name: Deployment evidence
        if: always()
        run: |
          echo "Source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Automatic database rollback is disabled. Check readiness logs and the retained manifest." >> "$GITHUB_STEP_SUMMARY"
