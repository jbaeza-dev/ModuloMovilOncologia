name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js and pnpm
        uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true
      - name: Check format, lint, and TypeScript
        run: pnpm run check
      - name: Check Expo dependencies
        run: pnpm --filter @modulo-movil-oncologia/mobile run doctor
      - name: Export Android JavaScript bundle
        run: pnpm --filter @modulo-movil-oncologia/mobile run bundle:android
