sonar.projectKey=modulo-movil-oncologia
sonar.projectName=QuimioCare
sonar.sourceEncoding=UTF-8
sonar.sources=apps/mobile/src,apps/simulator/src,apps/gateway/src,packages/contracts/src
sonar.tests=apps/mobile/src,apps/simulator/test,apps/gateway/test,packages/contracts/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.typescript.tsconfigPath=tsconfig.sonar.json
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**,**/*.d.ts
# Only declarations, generated types, test harnesses and explicitly gated laboratory screens.
sonar.coverage.exclusions=**/*.d.ts,**/testing/**,apps/mobile/src/features/preview/**,packages/contracts/src/generated-*.ts
# Generated before the scanner; no token or server address belongs in this file.
sonar.javascript.lcov.reportPaths=coverage/mobile-vitest/lcov.info,coverage/mobile-jest/lcov.info,coverage/contracts/lcov.info,coverage/simulator/lcov.info,coverage/simulator-integration/lcov.info,coverage/gateway/lcov.info,coverage/gateway-integration/lcov.info
